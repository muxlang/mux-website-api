name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Supersede an in-flight run for the SAME PR. Push runs deliberately get a
  # unique group (run_id): a shared group keeps only one pending run, so rapid
  # pushes to main would evict an intermediate commit's queued run before it
  # ever ran, leaving that commit unverified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint_workflows:
    # actionlint plus its built-in shellcheck integration (active once
    # shellcheck is on PATH, which it is on this image) - context #29's
    # lint-the-pipeline-itself ask. Ungated: a workflow-only change is exactly
    # what this exists to catch, and it is cheap enough not to need a filter.
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint + shellcheck
        run: ./scripts/ci/lint-workflows.sh

  api_checks:
    name: API Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          # Both files, because this job installs from both: a change to either
          # must miss the cache. cache-dependency-path drives the key, so
          # listing only the lock would serve stale dev wheels after a
          # requirements-dev.txt bump.
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - run: "pip install --only-binary :all: --require-hashes -r requirements.lock"
      - run: python -m py_compile server.py
      - run: python -c "import flask, flask_cors, flask_limiter, gunicorn"
      - name: Install test dependencies
        run: "pip install -r requirements-dev.txt"
      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy type check
        run: mypy server.py
      - name: Dependency advisory check
        run: pip-audit -r requirements.lock
      - name: Run tests with coverage
        run: python -m pytest -q --cov=server --cov-branch --cov-report=xml:coverage.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  production_image:
    name: Production image build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image
        run: docker build --pull --platform=linux/amd64 --tag mux-website-api:ci .
      - name: Build attested image metadata
        run: >-
          docker buildx build
          --pull
          --platform=linux/amd64
          --provenance=true
          --sbom=true
          --metadata-file /tmp/mux-image-metadata.json
          --output=type=oci,dest=/tmp/mux-website-api-attested.tar
          .
      - name: Verify image provenance and SBOM metadata
        run: |
          jq -e '
            has("buildx.build.provenance") and
            has("buildx.build.sbom")
          ' /tmp/mux-image-metadata.json
      - name: Smoke-test production image
        run: |
          docker run --rm --network none --entrypoint sh \
            -e RATE_LIMIT_STORAGE_URI=redis://smoke-test mux-website-api:ci -eu -c '
              python3 -c "import flask, flask_cors, flask_limiter, gunicorn"
              python3 -c "import server; assert \"--unshare-net\" in server._compiler_command(\"/workspace/input.mux\", \"/tmp\")"
              printf "func main() returns void {\\n    return\\n}\\n" > /tmp/smoke.mux
              mux run /tmp/smoke.mux
            '
      - name: Scan production image
        run: >-
          docker save --output /tmp/mux-website-api-ci.tar mux-website-api:ci &&
          docker run --rm
          -v /tmp/mux-website-api-ci.tar:/image.tar:ro
          aquasec/trivy@sha256:d77b8f01e4f75e0ad86617e92618210c12013d89a4c905216fbebd3c0ef90273 image
          --input /image.tar
          --exit-code 1
          --ignore-unfixed
          --scanners vuln
          --severity CRITICAL,HIGH
          mux-website-api:ci

  sonarqube:
    name: SonarQube
    needs: api_checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone for better analysis relevancy
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: coverage-xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The free SonarCloud plan locks every project to the built-in "Sonar way"
      # gate, which only fails on rating/coverage thresholds and lets new issues
      # (e.g. a single code smell) through. Enforce "zero new issues" ourselves:
      # the scan above waits for analysis (sonar.qualitygate.wait), so the count
      # is queryable here.
      - name: Fail on new SonarCloud issues
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/ci/sonar-new-issues.sh muxlang_mux-website-api "${{ github.event.pull_request.number }}"
